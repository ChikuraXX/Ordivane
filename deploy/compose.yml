name: ordivane-local
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORDIVANE_PG_ADMIN_PASSWORD:?请设置管理员密码}
      ORDIVANE_PLATFORM_DB_PASSWORD: ${ORDIVANE_PLATFORM_DB_PASSWORD:?请设置平台数据库密码}
      ORDIVANE_DEMO_DB_PASSWORD: ${ORDIVANE_DEMO_DB_PASSWORD:?请设置演示数据库密码}
    ports:
      - '127.0.0.1:${ORDIVANE_PG_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-ordivane.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ordivane
      RABBITMQ_DEFAULT_PASS: ${ORDIVANE_MQ_PASSWORD:?请设置消息服务密码}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  rabbitmq-data:

